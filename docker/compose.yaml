services:
  web:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    command:
      - /bin/bash
      - -c
      - |
        npm start
    environment:
      - RESOURCE_CONFIG=${RESOURCE_CONFIG}
      - OPERATION_CONFIG=${OPERATION_CONFIG}
      - ADDITIONAL_RESOURCE_CONTEXT=${ADDITIONAL_RESOURCE_CONTEXT}
    ports:
      - '${PORT}:3000'
